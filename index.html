<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Document Wallet</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<style>
:root{--bg:#f3f1fb;--glass:rgba(255,255,255,.58);--line:rgba(255,255,255,.8);--ink:#1d1b3a;--mute:#6a6890;--acc:#5b3df5;--accink:#fff;--bad:#d6334a;--sh:0 8px 30px rgba(70,50,160,.14);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12112a;--glass:rgba(40,38,80,.55);--line:rgba(255,255,255,.12);--ink:#ecebff;--mute:#a09ecb;--acc:#9a86ff;--accink:#14123a;--bad:#ff7a8c;--sh:0 8px 30px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12112a;--glass:rgba(40,38,80,.55);--line:rgba(255,255,255,.12);--ink:#ecebff;--mute:#a09ecb;--acc:#9a86ff;--accink:#14123a;--bad:#ff7a8c;--sh:0 8px 30px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font:16px/1.5 system-ui,"Segoe UI",sans-serif;background:var(--bg);overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(420px 420px at 10% 10%,#ff8fb866,transparent),radial-gradient(500px 500px at 90% 20%,#6ad6ff66,transparent),radial-gradient(500px 500px at 50% 100%,#a58bff66,transparent)}
h1,h2,h3{font-family:Sora,system-ui,sans-serif;margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(12px);border-radius:10px;padding:8px 14px}
button.p{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:600}
button:disabled{opacity:.6;cursor:wait}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--glass);backdrop-filter:blur(12px)}
.hide{display:none!important}
.glass{background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh)}
#gate{min-height:100vh;display:grid;place-items:center;padding:20px}
.box{padding:30px;width:100%;max-width:400px}
.box h1{font-size:28px;margin-bottom:6px}
.box p{color:var(--mute);margin:0 0 16px}
.box input{margin-bottom:10px}
.err{color:var(--bad);min-height:22px;font-size:14px;margin-bottom:8px}
#app{max-width:1000px;margin:0 auto;padding:20px 16px 90px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}
.top h1{font-size:26px}
.top div{display:flex;gap:8px}
.bar{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.bar input{flex:1;min-width:180px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.chips button.on{background:var(--acc);color:var(--accink);border-color:var(--acc)}
#add{padding:18px;margin-bottom:18px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
#add .w{grid-column:1/-1}
.warn{padding:12px 16px;margin-bottom:16px;border-left:5px solid #f5a524;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:20px}
.card{perspective:1100px;height:200px;cursor:pointer}
.in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,.8,.3,1)}
.card.f .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;overflow:hidden;box-shadow:var(--sh);padding:18px}
.front{background:linear-gradient(135deg,var(--a),var(--b));color:#fff}
.front::before,.front::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.16)}
.front::before{width:190px;height:190px;right:-60px;top:-70px}
.front::after{width:120px;height:120px;right:30px;bottom:-60px}
.ico{font-size:44px;position:relative;filter:drop-shadow(0 4px 6px rgba(0,0,0,.2))}
.front h3{position:absolute;left:18px;right:18px;bottom:40px;font-size:18px;text-shadow:0 1px 4px rgba(0,0,0,.25);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.front small{position:absolute;left:18px;right:18px;bottom:16px;opacity:.92;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chk{position:absolute;right:14px;top:12px;z-index:2}
.chk input{width:22px;height:22px;accent-color:#fff;padding:0}
.bdg{position:absolute;left:18px;top:70px;background:rgba(255,255,255,.9);color:#222;border-radius:20px;padding:1px 10px;font-size:12px;font-weight:600}
.bdg.x{background:#ffd9de;color:#a3152b}.bdg.w{background:#ffe9bd;color:#7a4b00}
.back{transform:rotateY(180deg);background:var(--glass);backdrop-filter:blur(18px);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px;padding:12px}
.pv{flex:1;border-radius:12px;background:rgba(127,127,160,.15);display:grid;place-items:center;overflow:hidden;color:var(--mute);font-size:14px}
.pv img,.pv object{width:100%;height:100%;object-fit:contain;border:0}
.acts{display:flex;gap:6px}.acts button{flex:1;padding:6px;font-size:13px}.acts .d{color:var(--bad)}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:40px 0}
#sel{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));padding:10px 16px;display:flex;gap:12px;align-items:center;z-index:5}
.note{color:var(--mute);font-size:13px;margin-top:26px}
@media(max-width:560px){#add{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.in{transition:none}}
</style>
</head>
<body>
<div id="gate">
 <form class="box glass" id="gf">
  <h1>Document Wallet</h1>
  <p>Enter your password to open your documents.</p>
  <input id="cid" class="hide" placeholder="Google Client ID (one-time setup)" autocomplete="off">
  <input type="password" id="pw" placeholder="Password" autocomplete="current-password">
  <input type="password" id="pw2" class="hide" placeholder="Confirm password" autocomplete="new-password">
  <div class="err" id="err" role="alert"></div>
  <button class="p" id="gb" style="width:100%">Unlock</button>
 </form>
</div>

<div id="app" class="hide">
 <div class="top"><h1>My Documents</h1><div><button id="th" aria-label="Switch dark mode">Dark mode</button><button id="addb" class="p">Add document</button><button id="lock">Lock</button></div></div>
 <div id="add" class="glass hide">
  <input type="file" id="file" multiple class="w">
  <select id="cat"></select>
  <input id="lab" placeholder="Title (e.g. Income certificate 2026)">
  <input id="tags" placeholder="Tags, separated by commas">
  <input type="date" id="exp" title="Expiry date (optional)" aria-label="Expiry date">
  <button class="p w" id="up">Encrypt and upload</button>
 </div>
 <div id="warn"></div>
 <div class="bar"><input id="q" placeholder="Search by title, tag or category"></div>
 <div class="chips" id="chips"></div>
 <div class="grid" id="grid"></div>
 <div id="sel" class="glass hide"><span id="sc"></span><button class="p" id="mg">Merge into one PDF</button><button id="cl">Clear</button></div>
 <p class="note">Files are encrypted in your browser with your password before they reach Google Drive. If you forget the password, they cannot be recovered. Locks after 5 minutes of inactivity. Click a card to flip it.</p>
</div>

<script>
const $=id=>document.getElementById(id),enc=new TextEncoder(),dec=new TextDecoder();
const D='https://www.googleapis.com/drive/v3',SC='https://www.googleapis.com/auth/drive.appdata';
const CATS={'Caste certificate':['#ff7eb3','#ff758c','🪪'],'Income certificate':['#11998e','#38ef7d','💰'],'Residence certificate':['#4facfe','#00c6fb','🏠'],'Internship certificate':['#f7971e','#ffb347','💼'],'Marksheet / Result':['#7f5af0','#b794f6','🎓'],'ID proof':['#2193b0','#6dd5ed','🆔'],'Other':['#636fa4','#a9b3d9','📄']};
let key,tok,tc,docs=[],q='',cat='All',sel=new Set(),tm;
const LS=k=>{try{return localStorage.getItem(k)}catch{return null}},SV=(k,v)=>{try{localStorage.setItem(k,v)}catch{}};
const e=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))),ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const err=m=>$('err').textContent=m;

/* theme */
{const t=LS('theme');if(t)document.documentElement.dataset.theme=t}
$('th').onclick=()=>{const d=document.documentElement,dark=d.dataset.theme?d.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;d.dataset.theme=dark?'light':'dark';SV('theme',d.dataset.theme)};

/* crypto */
async function derive(pw,salt){const b=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:310000,hash:'SHA-256'},b,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function seal(buf){const iv=crypto.getRandomValues(new Uint8Array(12)),c=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,buf));
 const o=new Uint8Array(12+c.length);o.set(iv);o.set(c,12);return o}
const unseal=u=>crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(0,12)},key,u.slice(12));

/* drive */
function token(){return new Promise((res,rej)=>{const cid=LS('cid');
 if(!window.google||!google.accounts)return rej(new Error('gsi'));
 if(!tc||tc.c!==cid){tc=google.accounts.oauth2.initTokenClient({client_id:cid,scope:SC,callback:r=>r.access_token?(tok=r.access_token,res()):rej(new Error(r.error)),error_callback:x=>rej(new Error(x.type))});tc.c=cid}
 tc.requestAccessToken({prompt:''});setTimeout(()=>rej(new Error('Google sign-in did not finish')),90000)})}
async function api(u,o={}){const r=await fetch(u,{...o,headers:{...o.headers,Authorization:'Bearer '+tok}});
 if(r.status===401&&!o.r){await token();return api(u,{...o,r:1})}
 if(!r.ok)throw new Error(r.status);return r}
async function list(){let out=[],p='';do{const j=await(await api(D+'/files?spaces=appDataFolder&pageSize=1000&fields=nextPageToken,files(id,name,description)'+(p?'&pageToken='+p:''))).json();out.push(...j.files);p=j.nextPageToken}while(p);return out}
async function put(name,desc,body){const bd='b'+Date.now();
 const blob=new Blob(['--'+bd+'\r\nContent-Type: application/json\r\n\r\n'+JSON.stringify({name,parents:['appDataFolder'],description:desc})+'\r\n--'+bd+'\r\nContent-Type: application/octet-stream\r\n\r\n',body,'\r\n--'+bd+'--']);
 return(await api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+bd},body:blob})).json()}
async function bytes(d){const r=await api(D+'/files/'+d.id+'?alt=media');return unseal(new Uint8Array(await r.arrayBuffer()))}

/* gate */
if(!LS('cid'))$('cid').classList.remove('hide');
$('gf').onsubmit=async ev=>{ev.preventDefault();err('');
 const c=$('cid').value.trim();if(c)SV('cid',c);
 if(!LS('cid'))return err('Paste your Google Client ID once (see setup guide).');
 const pw=$('pw').value;if(!pw)return err('Enter your password.');
 $('gb').disabled=true;
 try{if(!tok)await token();const files=await list(),cfg=files.find(f=>f.name==='vault.cfg');
  if(!cfg){
   if($('pw2').classList.contains('hide')){$('pw2').classList.remove('hide');err('No vault found. Confirm a password to create one.');return}
   if(pw.length<8)return err('Use at least 8 characters.');
   if(pw!==$('pw2').value)return err('Passwords do not match.');
   const salt=crypto.getRandomValues(new Uint8Array(16));key=await derive(pw,salt);
   await put('vault.cfg',JSON.stringify({s:b64(salt),c:b64(await seal(enc.encode('ok')))}),'x');
  }else{const j=JSON.parse(cfg.description);key=await derive(pw,ub(j.s));
   try{await unseal(ub(j.c))}catch{key=null;return err('Wrong password.')}}
  $('pw').value=$('pw2').value='';$('gate').classList.add('hide');$('app').classList.remove('hide');
  await load();bump();
 }catch(x){err('Could not connect ('+(x&&x.message||'unknown')+'). Check the Client ID, the Drive API being enabled, and that your Gmail is a test user.')}
 finally{$('gb').disabled=false}};

/* data */
async function load(){const fs=(await list()).filter(f=>f.name==='d.bin');docs=[];
 for(const f of fs){try{docs.push({...JSON.parse(dec.decode(await unseal(ub(f.description)))),id:f.id})}catch{}}
 docs.sort((a,b)=>b.date-a.date);draw()}
const days=x=>Math.ceil((new Date(x+'T23:59:59')-Date.now())/864e5);
function draw(){
 const cs=['All',...Object.keys(CATS).filter(c=>docs.some(d=>d.cat===c))];if(!cs.includes(cat))cat='All';
 $('chips').innerHTML='';cs.forEach(c=>{const b=document.createElement('button');b.textContent=c;if(c===cat)b.className='on';b.onclick=()=>{cat=c;draw()};$('chips').append(b)});
 const soon=docs.filter(d=>d.exp&&days(d.exp)<=30);
 $('warn').innerHTML=soon.length?'<div class="warn glass"><b>Needs attention:</b> '+soon.map(d=>e(d.label)+(days(d.exp)<0?' (expired)':' (in '+days(d.exp)+' days)')).join(', ')+'</div>':'';
 const s=q.toLowerCase(),show=docs.filter(d=>(cat==='All'||d.cat===cat)&&(!s||(d.label+' '+d.cat+' '+d.tags.join(' ')).toLowerCase().includes(s)));
 const g=$('grid');g.innerHTML=show.length?'':'<div class="empty">No documents yet. Use “Add document” to upload your first one.</div>';
 show.forEach(d=>{const [a,b,i]=CATS[d.cat]||CATS.Other,n=d.exp?days(d.exp):null,c=document.createElement('div');c.className='card';
  c.innerHTML='<div class="in"><div class="face front" style="--a:'+a+';--b:'+b+'"><span class="chk"><input type="checkbox" aria-label="Select for PDF"'+(sel.has(d.id)?' checked':'')+'></span><span class="ico">'+i+'</span>'+
  (n!==null?'<span class="bdg '+(n<0?'x':n<=30?'w':'')+'">'+(n<0?'Expired':n+' days left')+'</span>':'')+'<h3>'+e(d.label)+'</h3><small>'+e(d.cat)+(d.tags.length?' · '+e(d.tags.join(', ')):'')+'</small></div>'+
  '<div class="face back"><div class="pv">Loading preview…</div><div class="acts"><button data-a="o">Open</button><button data-a="d">Download</button><button data-a="x" class="d">Delete</button></div></div></div>';
  c.onclick=ev=>{const t=ev.target;
   if(t.matches('.chk input')){t.checked?sel.add(d.id):sel.delete(d.id);bar();return}
   if(t.dataset.a){act(d,t.dataset.a);return}
   c.classList.toggle('f');if(c.classList.contains('f')&&!c.dataset.l){c.dataset.l=1;prev(d,c.querySelector('.pv'))}};
  g.append(c)});bar()}
async function prev(d,el){try{const u=URL.createObjectURL(new Blob([await bytes(d)],{type:d.type}));d.u=u;
 el.innerHTML=d.type.startsWith('image/')?'<img alt="">':d.type==='application/pdf'?'<object type="application/pdf"></object>':'No preview for this file type';
 const t=el.firstElementChild;if(t)t.tagName==='IMG'?t.src=u:t.data=u}catch{el.textContent='Preview failed'}}
async function act(d,a){try{
 if(a==='x'){if(!confirm('Delete “'+d.label+'” permanently?'))return;await api(D+'/files/'+d.id,{method:'DELETE'});sel.delete(d.id);return load()}
 const u=d.u||URL.createObjectURL(new Blob([await bytes(d)],{type:d.type}));
 if(a==='d'){const l=document.createElement('a');l.href=u;l.download=d.name;l.click()}else open(u,'_blank')}catch{alert('Could not complete that action.')}}
function bar(){$('sel').classList.toggle('hide',!sel.size);$('sc').textContent=sel.size+' selected'}
$('cl').onclick=()=>{sel.clear();draw()};

/* upload */
$('cat').innerHTML=Object.keys(CATS).map(c=>'<option>'+c+'</option>').join('');
$('addb').onclick=()=>$('add').classList.toggle('hide');
$('up').onclick=async()=>{const fs=[...$('file').files];if(!fs.length)return alert('Choose at least one file.');
 $('up').disabled=true;$('up').textContent='Encrypting and uploading…';
 try{for(const f of fs){const m={name:f.name,type:f.type||'application/octet-stream',size:f.size,cat:$('cat').value,label:(fs.length===1&&$('lab').value.trim())||f.name.replace(/\.[^.]+$/,''),tags:$('tags').value.split(',').map(t=>t.trim()).filter(Boolean),exp:$('exp').value,date:Date.now()};
  await put('d.bin',b64(await seal(enc.encode(JSON.stringify(m)))),await seal(await f.arrayBuffer()))}
  $('file').value=$('lab').value=$('tags').value=$('exp').value='';$('add').classList.add('hide');await load()
 }catch{alert('Upload failed. Check your connection and try again.')}
 $('up').disabled=false;$('up').textContent='Encrypt and upload'};

/* search, merge, lock */
$('q').oninput=ev=>{q=ev.target.value;draw()};
$('mg').onclick=async()=>{const{PDFDocument}=PDFLib;$('mg').disabled=true;$('mg').textContent='Merging…';const out=await PDFDocument.create(),skip=[];
 try{for(const id of sel){const d=docs.find(x=>x.id===id),b=await bytes(d);
  if(d.type==='application/pdf'){const s=await PDFDocument.load(b);(await out.copyPages(s,s.getPageIndices())).forEach(p=>out.addPage(p))}
  else if(/image\/(jpeg|png)/.test(d.type)){const im=d.type.includes('png')?await out.embedPng(b):await out.embedJpg(b),k=Math.min(555/im.width,802/im.height),w=im.width*k,h=im.height*k,p=out.addPage([595,842]);p.drawImage(im,{x:(595-w)/2,y:(842-h)/2,width:w,height:h})}
  else skip.push(d.label)}
  if(!out.getPageCount())throw 0;
  const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([await out.save()],{type:'application/pdf'}));l.download='merged-documents.pdf';l.click();
  if(skip.length)alert('Skipped (only PDF, JPG and PNG can be merged): '+skip.join(', '))
 }catch{alert('Could not merge. Select PDF, JPG or PNG files.')}
 $('mg').disabled=false;$('mg').textContent='Merge into one PDF'};
const bump=()=>{clearTimeout(tm);tm=setTimeout(()=>location.reload(),3e5)};
$('lock').onclick=()=>location.reload();
['click','keydown','touchstart'].forEach(v=>document.addEventListener(v,()=>{if(key)bump()}));
</script>
</body>
</html>
